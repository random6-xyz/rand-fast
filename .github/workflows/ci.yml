name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # The full compatibility matrix also runs weekly, even when nothing changed,
    # so a runner-image or toolchain drift is visible before a release.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verification gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ebpf
      - name: Run verification gate
        run: tools/verify.sh

  qemu-real-kernel:
    name: Real-kernel QEMU gate (6.12.115)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    concurrency:
      group: qemu-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-qemu-gate
        with:
          kernel-id: 6.12.115
          kernel-version: 6.12.115
          psi: yes

  kernel-changes:
    name: Detect kernel-sensitive changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      kernel: ${{ steps.paths.outputs.kernel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        name: Compare the pull request with its base
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE...HEAD" \
            | grep -Eq '^(fast-ebpf/|fast-common/|fast/src/(tracepoint_layout|io_request_layout|network|json_payloads)\.rs|tools/kernel/|tools/qemu-|tools/scenarios\.json|\.github/(actions/run-qemu-gate|workflows/ci\.yml))'; then
            echo "kernel=true" >>"$GITHUB_OUTPUT"
          else
            echo "kernel=false" >>"$GITHUB_OUTPUT"
          fi

  kernel-matrix:
    name: Kernel matrix (${{ matrix.id }})
    needs: kernel-changes
    if: |
      always() && (github.event_name != 'pull_request'
        || needs.kernel-changes.outputs.kernel == 'true'
        || contains(github.event.pull_request.labels.*.name, 'kernel-matrix'))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    concurrency:
      group: qemu-matrix-${{ github.ref }}-${{ matrix.id }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - id: 6.1.191
            version: 6.1.191
            psi: yes
          - id: 6.6.161
            version: 6.6.161
            psi: yes
          - id: 7.2.15
            version: 7.2.15
            psi: yes
          # The same 6.12 image without PSI. This cell proves the unavailable
          # signal path: memory pressure must be reported as unavailable, not
          # as zero, and the required non-PSI checks must still pass.
          - id: 6.12.115-nopsi
            version: 6.12.115
            psi: no
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-qemu-gate
        with:
          kernel-id: ${{ matrix.id }}
          kernel-version: ${{ matrix.version }}
          psi: ${{ matrix.psi }}

  benchmark:
    name: Collector overhead benchmark
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'benchmark')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ebpf
      - name: Install QEMU and kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            qemu-system-x86 busybox-static cpio gcc libc6-dev e2fsprogs \
            bc flex bison libelf-dev libssl-dev dwarves zstd xz-utils
      - name: Restore the pinned kernel
        uses: actions/cache@v4
        with:
          path: ~/.cache/rand-fast-kernels/6.12.115
          key: kernel-${{ runner.os }}-6.12.115-${{ hashFiles('tools/kernel/kernels.tsv', 'tools/kernel/config.fragment', 'tools/kernel/config.nopsi.fragment', 'tools/kernel/build.sh') }}
      - name: Build the pinned kernel
        run: |
          kernel=$(tools/kernel/build.sh 6.12.115)
          echo "KERNEL=$kernel" >>"$GITHUB_ENV"
      - name: Run the paired benchmark
        env:
          OUT_DIR: ${{ runner.temp }}/bench
          BENCH_OUT: ${{ runner.temp }}/bench-report.json
          BENCH_DURATION: 3s
          BENCH_REPETITIONS: '1'
          CPUS: '4'
          QEMU_TIMEOUT: '4200'
        run: tools/bench.sh
      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            ${{ runner.temp }}/bench-report.json
            ${{ runner.temp }}/bench/guest.log
          if-no-files-found: warn
          retention-days: 14
