name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verification gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ebpf
      - name: Run verification gate
        run: tools/verify.sh

  qemu-real-kernel:
    name: Real-kernel QEMU gate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      KERNEL_VERSION: 6.12.115
    concurrency:
      group: qemu-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ebpf

      - name: Install QEMU and kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            qemu-system-x86 busybox-static cpio gcc libc6-dev e2fsprogs \
            bc flex bison libelf-dev libssl-dev dwarves zstd xz-utils

      - name: Restore the pinned kernel
        uses: actions/cache@v4
        with:
          path: ~/.cache/rand-fast-kernels
          key: kernel-${{ runner.os }}-${{ env.KERNEL_VERSION }}-${{ hashFiles('tools/kernel/kernels.tsv', 'tools/kernel/config.fragment', 'tools/kernel/build.sh') }}

      - name: Build the pinned kernel
        run: |
          kernel=$(tools/kernel/build.sh "$KERNEL_VERSION")
          echo "KERNEL=$kernel" >>"$GITHUB_ENV"

      - name: Boot the guest and run the real-kernel matrix
        env:
          CPUS: '4'
          MEM_MB: '2048'
          OUT_DIR: ${{ runner.temp }}/qemu
          QEMU_TIMEOUT: '4200'
        run: tools/qemu-run.sh

      - name: Audit the guest log
        if: always()
        run: |
          # The record must exist even when the guest failed to boot, which is
          # exactly when it is most useful.
          mkdir -p "$RUNNER_TEMP/qemu/kernel"
          cp "$HOME/.cache/rand-fast-kernels/$KERNEL_VERSION/config" \
            "$RUNNER_TEMP/qemu/kernel/config" 2>/dev/null || true
          cp "$HOME/.cache/rand-fast-kernels/$KERNEL_VERSION/build-info.txt" \
            "$RUNNER_TEMP/qemu/kernel/build-info.txt" 2>/dev/null || true
          tools/check-qemu-results.sh \
            --log "$RUNNER_TEMP/qemu/guest.log" \
            --kernel "$KERNEL_VERSION" \
            --scenarios "$(sed -n 's/^SCENARIO_COUNT=//p' tools/scenarios.sh)" \
            --output "$RUNNER_TEMP/qemu/cell.json"

      - name: Upload the guest log and kernel record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-real-kernel-${{ env.KERNEL_VERSION }}
          path: |
            ${{ runner.temp }}/qemu/guest.log
            ${{ runner.temp }}/qemu/qemu-status.txt
            ${{ runner.temp }}/qemu/cell.json
            ${{ runner.temp }}/qemu/ldd.txt
            ${{ runner.temp }}/qemu/kernel/config
            ${{ runner.temp }}/qemu/kernel/build-info.txt
          if-no-files-found: warn
          retention-days: 14
