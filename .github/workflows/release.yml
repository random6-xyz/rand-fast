name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ebpf
      - name: Run verification gate
        run: tools/verify.sh

  publish:
    name: Build and publish Linux x86_64 release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ebpf
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Build and verify release assets
        run: tools/package-release.sh "$GITHUB_REF_NAME"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "target/release-assets/rand-fast-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            target/release-assets/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
