name: Set up Rust and eBPF build tools
description: Install the toolchain used to build rand-fast and its embedded eBPF object
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: clippy, rustfmt, rust-src
    - name: Install LLVM 19
      shell: bash
      run: |
        curl --fail --silent --show-error --location https://apt.llvm.org/llvm.sh --output /tmp/llvm.sh
        chmod +x /tmp/llvm.sh
        sudo /tmp/llvm.sh 19
        sudo apt-get install --yes llvm-19-dev libclang-19-dev
    - name: Install bpf-linker
      shell: bash
      env:
        LLVM_SYS_191_PREFIX: /usr/lib/llvm-19
      run: cargo install bpf-linker --version 0.9.14 --locked
